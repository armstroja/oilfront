<script>

const ST={scout:{n:'Scout Car',k:'Q',cost:80,hp:60,spd:130,rng:120,dmg:6,rate:.35,vis:420},

const shade=(h,f)=>{const n=parseInt(h.slice(1),16),k=v=>Math.max(0,Math.min(255,Math.round(v*f)));return '#'+[n>>16,n>>8&255,n&255].map(v=>k(v).toString(16).padStart(2,'0')).join('')};

const line=(c,a,b,x,y,col)=>{let dx=Math.abs(x-a),dy=-Math.abs(y-b),sx=a<x?1:-1,sy=b<y?1:-1,e=dx+dy;for(;;){dot(c,a,b,col);if(a==x&&b==y)break;const e2=2*e;if(e2>=dy){e+=dy;a+=sx}if(e2<=dx){e+=dx;b+=sy}}};

S.roadStraight={w:16,h:16,draw(c){rect(c,0,2,16,1,'rgba(40,40,30,.3)');rect(c,0,13,16,1,'rgba(40,40,30,.3)');rect(c,0,3,16,10,PAL.road);rect(c,0,3,16,1,shade(PAL.road,1.12));rect(c,0,12,16,1,shade(PAL.road,.85));for(let x=0;x<16;x++){if(x%8<4)dot(c,x,7,PAL.roadHi);for(let y=4;y<12;y++)if(hrnd(x,y,4)<.07)dot(c,x,y,shade(PAL.road,.9))}}};

function onRoad(x,y){
 for(const n of N){
  if(n.dormant)continue;
  if(hyp(n.x-x,n.y-y)<(n.R||12))return 1;
  for(const e of n.a){
   if(e.br&&e.br.hp<=0)continue;
   const d=ptSegDist(x,y,n.x,n.y,e.n.x,e.n.y);
   if(d<10)return 1;
  }
 }
 return 0;
}

function ptSegDist(px,py,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
 if(!l2)return hyp(px-x1,py-y1);

 return hyp(px-(x1+t*dx),py-(y1+t*dy));
}

    }
   }
   // Buildings / Defences / Rigs / Towns
   if((e.t=='hq'||e.t=='town')&&e.q&&e.q.length){
    e.qt+=dt;
    if(e.qt>=e.q[0].tm){
     const item=e.q.shift();e.qt=0;
     const ang=rnd(0,6.28);
     const nu=unit(item.t,e.f,e.x+Math.cos(ang)*36,e.y+Math.sin(ang)*36);
     if(e.rally)setMove(nu,e.rally.x+rnd(-18,18),e.rally.y+rnd(-18,18));
     if(e.f==0)say(ST[item.t].n+' ready.');
    }
   }
   // Passive income from towns/HQs + slow nearby repair
   if(e.f>=0&&(e.t=='town'||e.t=='hq')){
    F[e.f].oil+=(e.t=='hq'?8:4)*dt;
    for(const u of E)if(u.u&&u.f==e.f&&u.hp<u.mhp&&hyp(u.x-e.x,u.y-e.y)<68)u.hp=Math.min(u.mhp,u.hp+8*dt);
   }
   // Capture logic for neutral/enemy towns & rigs
   if(e.t=='rig'||(e.t=='town'&&!e.capital)){
    const near=E.filter(u=>u.u&&!u.dead&&u.drop<=0&&hyp(u.x-e.x,u.y-e.y)<e.r+28);
    const facs=[...new Set(near.map(u=>u.f))];
    if(facs.length==1){
     const cf=facs[0];
     if(cf!=e.f){
      const power=near.reduce((s,u)=>s+(u.t=='inf'||u.t=='eng'?1.6:1),0);
      if(e.cf!=cf){e.cf=cf;e.cap=0}
      e.cap+=18*power*dt;
      if(e.cap>=100){
       e.f=cf;e.cap=0;e.cf=-1;
       if(e.t=='rig'&&e.tk){kill(e.tk);e.tk=null}
       if(cf==0)say((e.t=='rig'?'Oil Rig':'Town')+' captured!');
       else if(e.f==0)say((e.t=='rig'?'Oil Rig':'Town')+' lost!');
      }
     }else{e.cap=Math.max(0,e.cap-15*dt)}
    }else if(facs.length==0){e.cap=Math.max(0,e.cap-10*dt)}
   }
   // Oil Rig fuel truck management
   if(e.t=='rig'&&e.f>=0){
    if(e.tk&&e.tk.dead)e.tk=null;
    if(!e.tk){
     e.tm-=dt;
     if(e.tm<=0){
      e.tm=8;
      const tk=unit('truck',e.f,e.x,e.y+24);
      tk.rig=e;tk.load=0;tk.state='toBase';
      e.tk=tk;
     }
    }
   }
   // Defensive turrets & bunkers
   if(e.def&&e.f>=0){
    const d=DEF[e.k];
    if(d&&d.rng){
     // Find target
     let best=null,bd=d.rng;
     for(const o of E){
      if(o.f==e.f||o.f<0||o.dead||o.drop>0)continue;
      if(d.vs&&!d.vs.includes(o.t))continue;
      const dist=hyp(o.x-e.x,o.y-e.y);
      if(d.min&&dist<d.min)continue;
      if(dist<bd&&seen(e.f,o)){bd=dist;best=o}
     }
     if(best){
      e.gang=Math.atan2(best.y-e.y,best.x-e.x)+Math.PI/2;
      if(e.cd<=0){
       const shots=e.k=='bunker'?1+(e.garUnits?e.garUnits.length:0):1;
       e.cd=d.rate;
       for(let s=0;s<shots;s++){
        fireProj(e,best.x+rnd(-6,6),best.y+rnd(-6,6),{
         sp:d.sp||520,dmg:d.dmg*mult(d.a,best.t),splash:d.splash||0,a:d.a,ar:d.ar||0,tgt:d.ar?null:best
        });
       }
      }
     }
    }
    // C-RAM projectile interception
    if(d&&d.cram){
     let bestP=null,bd=d.rng;
     for(const p of P){
      if(p.f==e.f||(!p.rocket&&!p.ar))continue;
      const dist=hyp(p.x-e.x,p.y-e.y);
      if(dist<bd){bd=dist;bestP=p}
     }
     if(bestP){
      e.gang=Math.atan2(bestP.y-e.y,bestP.x-e.x)+Math.PI/2;
      if(e.cd<=0){
       e.cd=d.rate;
       FX.push({beam:1,x1:e.x,y1:e.y,x2:bestP.x,y2:bestP.y,t:0});
       fx(bestP.x,bestP.y,10);
       P.splice(P.indexOf(bestP),1);
      }
     }
    }
   }
   continue;
  }

  // Mobile unit logic
  const s=ST[e.t];
  // Fuel Truck automated hauling loop
  if(e.t=='truck'&&e.rig){
   if(e.rig.f!=e.f||e.rig.dead){kill(e);continue}
   if(e.state=='toBase'){
    // Find nearest friendly town/hq on same side or reachable
    let dest=null,bd=1e9;
    for(const b of E)if(b.f==e.f&&(b.t=='hq'||b.t=='town')){const dist=hyp(b.x-e.x,b.y-e.y);if(dist<bd){bd=dist;dest=b}}
    if(dest){
     if(bd<dest.r+24){
      F[e.f].oil+=75;
      FX.push({txt:'+75',x:dest.x,y:dest.y-20,col:FC[e.f],t:0});
      e.state='toRig';e.path=[];
     }else if(!e.path.length){
      const r=route(nearestNode(e.x,e.y),dest.nd);
      e.path=r&&r.length?r.map(n=>({x:n.x,y:n.y})):[{x:dest.x,y:dest.y}];
     }
    }
   }else{
    const dist=hyp(e.rig.x-e.x,e.rig.y-e.y);
    if(dist<e.rig.r+22){
     e.state='toBase';e.path=[];
    }else if(!e.path.length){
     const r=route(nearestNode(e.x,e.y),e.rig.nd);
     e.path=r&&r.length?r.map(n=>({x:n.x,y:n.y})):[{x:e.rig.x,y:e.rig.y}];
    }
   }
  }

  // Validate target
  if(e.tgt&&(e.tgt.dead||e.tgt.hp<=0))e.tgt=null;

  // Engineer / Bridge layer auto-repair nearby friendly structures/bridges if idle
  if((e.t=='eng'||e.t=='blayer')&&!e.tgt&&!e.path.length&&e.cd<=0){
   for(const b of bridges)if(b.hp<b.mhp&&hyp(b.x-e.x,b.y-e.y)<90){
    b.hp=Math.min(b.mhp,b.hp+35*dt);
    if(Math.random()<0.15)FX.push({spark:1,x:b.x+rnd(-12,12),y:b.y+rnd(-8,8),t:0});
   }
   if(e.t=='eng'){
    for(const o of E)if(o!=e&&o.f==e.f&&o.hp<o.mhp&&hyp(o.x-e.x,o.y-e.y)<65){
     o.hp=Math.min(o.mhp,o.hp+22*dt);
     if(Math.random()<0.15)FX.push({spark:1,x:o.x+rnd(-8,8),y:o.y+rnd(-8,8),t:0});
    }
    // Clear adjacent enemy tank traps
    for(const o of [...E])if(o.f!=e.f&&o.k=='trap'&&hyp(o.x-e.x,o.y-e.y)<45){
     hurt(o,45*dt);
    }
   }
  }

  // Specific target interactions (Repair, Garrison, Attack)
  if(e.tgt){
   const dist=hyp(e.tgt.x-e.x,e.tgt.y-e.y);
   if(e.act=='repair'&&e.tgt.f==e.f){
    if(dist<55){
     e.path=[];
     if(e.tgt.hp<e.tgt.mhp){
      e.tgt.hp=Math.min(e.tgt.mhp,e.tgt.hp+35*dt);
      if(Math.random()<0.2)FX.push({spark:1,x:e.tgt.x+rnd(-8,8),y:e.tgt.y+rnd(-8,8),t:0});
     }else{e.tgt=null;e.act=null}
    }else if(!e.path.length)setMove(e,e.tgt.x,e.tgt.y);
   }else if(e.act=='garrison'&&e.tgt.k=='bunker'&&e.tgt.f==e.f){
    if(dist<34){
     e.tgt.garUnits=e.tgt.garUnits||[];
     if(e.tgt.garUnits.length<3){
      e.tgt.garUnits.push(e);
      E.splice(E.indexOf(e),1);
      const si=sel.indexOf(e);if(si>=0)sel.splice(si,1);
      if(e.f==0)say('Infantry garrisoned in Bunker ('+e.tgt.garUnits.length+'/3)');
      continue;
     }else{e.tgt=null;e.act=null}
    }else if(!e.path.length)setMove(e,e.tgt.x,e.tgt.y);
   }else if(e.tgt.f!=e.f&&s.rng>0){
    // Combat target
    if(dist<=s.rng){
     e.path=[];
     const ang=Math.atan2(e.tgt.y-e.y,e.tgt.x-e.x)+Math.PI/2;
     if(e.t=='tank')e.tang=ang-e.ang;
     else e.ang=ang;
     if(e.cd<=0){
      e.cd=s.rate;
      const dmg=s.dmg*mult(e.t,e.tgt.t||'inf');
      fireProj(e,e.tgt.x+rnd(-5,5),e.tgt.y+rnd(-5,5),{
       sp:e.t=='art'?290:540,dmg,splash:s.splash||0,a:e.t,rocket:e.t=='art'?1:0,tgt:e.t=='art'?null:e.tgt
      });
     }
    }else if(!e.stop){
     if(!e.path.length||hyp(e.path[e.path.length-1].x-e.tgt.x,e.path[e.path.length-1].y-e.tgt.y)>40){
      setMove(e,e.tgt.x,e.tgt.y);
      e.act='attack';
     }
    }
   }
  }else if(s.rng>0){
   // Auto-acquire visible enemy in range (or slightly beyond if not holding position)
   const scan=e.stop?s.rng:s.rng+65;
   let best=null,bd=scan;
   for(const o of E){
    if(o.f==e.f||o.f<0||o.dead||o.drop>0)continue;
    if(!seen(e.f,o))continue;
    const dist=hyp(o.x-e.x,o.y-e.y);
    if(dist<bd){bd=dist;best=o}
   }
   if(best){
    if(bd<=s.rng){
     const ang=Math.atan2(best.y-e.y,best.x-e.x)+Math.PI/2;
     if(e.t=='tank')e.tang=ang-e.ang;
     else e.ang=ang;
     if(e.cd<=0){
      e.cd=s.rate;
      const dmg=s.dmg*mult(e.t,best.t||'inf');
      fireProj(e,best.x+rnd(-5,5),best.y+rnd(-5,5),{
       sp:e.t=='art'?290:540,dmg,splash:s.splash||0,a:e.t,rocket:e.t=='art'?1:0,tgt:e.t=='art'?null:best
      });
     }
    }else if(!e.path.length&&!e.stop){
     e.tgt=best;e.act='attack';
    }
   }
  }

  // Movement along waypoints
  if(e.path.length){
   const wp=e.path[0],dx=wp.x-e.x,dy=wp.y-e.y,d=hyp(dx,dy);
   if(d<6){
    e.path.shift();
   }else{
    const roadMul=onRoad(e.x,e.y)?1.35:1;
    const rainMul=1-.15*WX.rain;
    const spd=s.spd*roadMul*rainMul;
    const nx=e.x+(dx/d)*spd*dt,ny=e.y+(dy/d)*spd*dt;
    // Check water & enemy blocking defences (checkpoints / tank traps)
    const blockedByDef=E.some(o=>o.blk&&!(o.gate&&o.f==e.f)&&hyp(o.x-nx,o.y-ny)<(o.r||10)+8);
    if(!isWater(nx,ny)&&!blockedByDef){
     e.x=cl(nx,16,W-16);e.y=cl(ny,16,W-16);
     e.ang=Math.atan2(dy,dx)+Math.PI/2;
    }else{
     e.path.shift();
    }
   }
  }

  // Soft unit-unit separation so squads don't stack into a single pixel
  for(const o of E){
   if(o==e||!o.u||o.dead||o.drop>0)continue;
   const dx=e.x-o.x,dy=e.y-o.y,d=hyp(dx,dy);
   if(d>0&&d<13){
    const push=(13-d)*1.8*dt;
    const nx=e.x+(dx/d)*push,ny=e.y+(dy/d)*push;
    if(!isWater(nx,ny)){e.x=cl(nx,16,W-16);e.y=cl(ny,16,W-16)}
   }
  }
 }
}

function updateProjectiles(dt){
 for(let i=P.length-1;i>=0;i--){
  const p=P[i];
  p.t+=dt;
  if(p.tgt&&!p.tgt.dead&&!p.ar&&!p.rocket){
   p.tx=p.tgt.x;p.ty=p.tgt.y;
  }
  const prog=cl(p.t/p.tot,0,1);
  p.x=p.sx+(p.tx-p.sx)*prog;
  p.y=p.sy+(p.ty-p.sy)*prog;
  if(p.rocket){
   p.smokeT+=dt;
   if(p.smokeT>.04){p.smokeT=0;CR.push({x:p.x,y:p.y,t:0})}
  }
  if(prog>=1){
   P.splice(i,1);
   if(p.splash>0){
    fx(p.tx,p.ty,p.splash*.5);
    SC.push({x:p.tx,y:p.ty,ang:rnd(0,6.28)});if(SC.length>90)SC.shift();
    for(const o of [...E]){
     if(o.f==p.f||o.dead)continue;
     const d=hyp(o.x-p.tx,o.y-p.ty);
     if(d<=p.splash)hurt(o,p.dmg*(1-d/(p.splash*1.25)));
    }
    for(const b of bridges){
     if(b.hp>0&&hyp(b.x-p.tx,b.y-p.ty)<=p.splash)b.hp=Math.max(0,b.hp-p.dmg*.7);
    }
   }else{
    FX.push({spark:1,x:p.tx,y:p.ty,t:0});
    if(p.tgt&&!p.tgt.dead){
     hurt(p.tgt,p.dmg);
    }else{
     for(const o of [...E])if(o.f!=p.f&&!o.dead&&hyp(o.x-p.tx,o.y-p.ty)<14){hurt(o,p.dmg);break}
     for(const b of bridges)if(b.hp>0&&hyp(b.x-p.tx,b.y-p.ty)<22){b.hp=Math.max(0,b.hp-p.dmg*.6);break}
    }
   }
  }
 }
}

function updateHelis(dt){
 for(let i=HE.length-1;i>=0;i--){
  const h=HE[i];
  h.rot+=dt*26;
  if(h.st==0){
   const dx=h.tx-h.x,dy=h.ty-h.y,d=hyp(dx,dy);
   if(d<14){h.st=1;h.tm=1.4}
   else{
    h.ang=Math.atan2(dy,dx)+Math.PI/2;
    h.x+=(dx/d)*185*dt;h.y+=(dy/d)*185*dt;
   }
  }else if(h.st==1){
   h.tm-=dt;
   if(!h.dropped&&h.tm<.8){
    h.dropped=1;
    for(let k=0;k<2;k++){
     const u=unit('inf',h.f,h.tx+(k?-14:14),h.ty+rnd(-8,8));
     u.drop=.6;
    }
   }
   if(h.tm<=0){
    h.st=2;
    h.ang=Math.atan2(h.sy-h.y,h.sx-h.x)+Math.PI/2;
   }
  }else{
   const dx=h.sx-h.x,dy=h.sy-h.y,d=hyp(dx,dy);
   if(d<24)HE.splice(i,1);
   else{h.x+=(dx/d)*210*dt;h.y+=(dy/d)*210*dt}
  }
 }
}

function updateFX(dt){
 for(let i=FX.length-1;i>=0;i--){
  FX[i].t+=dt;
  if(FX[i].t>(FX[i].beam?.12:FX[i].txt?1.1:.45))FX.splice(i,1);
 }
 for(let i=CR.length-1;i>=0;i--){
  CR[i].t+=dt;
  if(CR[i].t>.55)CR.splice(i,1);
 }
 // Weather progression
 WX.tm-=dt;
 if(WX.tm<=0){
  const modes=['clear','clear','sand','rain'];
  WX.mode=modes[Math.random()*modes.length|0];
  WX.tm=rnd(35,60);
  if(WX.mode=='sand')say('Weather Alert: Sandstorm reducing visibility!');
  else if(WX.mode=='rain')say('Weather Alert: Heavy rain slowing off-road movement.');
 }
 WX.sand+=(WX.mode=='sand'?1:0-WX.sand)*dt*.35;
 WX.rain+=(WX.mode=='rain'?1:0-WX.rain)*dt*.35;
}

function updateAI(dt){
 for(let i=1;i<5;i++){
  const f=F[i];
  if(!f.alive)continue;
  if(f.airCd>0)f.airCd-=dt;
  f.at-=dt;
  if(f.at>0)continue;
  f.at=rnd(1.8,2.8);

  const myBases=E.filter(e=>e.f==i&&(e.t=='hq'||e.t=='town'));
  const myUnits=E.filter(e=>e.f==i&&e.u);
  const myRigs=rigs.filter(r=>r.f==i);
  const mySilos=E.filter(e=>e.f==i&&e.k=='silo'&&!e.dead);
  const hq=myBases.find(b=>b.t=='hq')||myBases[0];

  // 1. Train units at HQ
  if(hq&&hq.q.length<2){
   const counts={scout:0,inf:0,eng:0,tank:0,art:0};
   myUnits.forEach(u=>{if(counts[u.t]!=null)counts[u.t]++});
   if(counts.eng<2&&f.oil>=120)queueUnit(hq,'eng');
   else if(counts.inf<4&&f.oil>=100)queueUnit(hq,'inf');
   else if(counts.scout<2&&f.oil>=80)queueUnit(hq,'scout');
   else if(counts.tank<5&&f.oil>=220)queueUnit(hq,'tank');
   else if(counts.art<3&&f.oil>=260)queueUnit(hq,'art');
  }

  // 2. Send idle units to capture neutral Oil Rigs & Towns
  const idle=myUnits.filter(u=>u.t!='truck'&&u.t!='eng'&&!u.path.length&&!u.tgt);
  if(idle.length){
   const targets=[...rigs,...towns].filter(o=>o.f!=i);
   if(targets.length){
    targets.sort((a,b)=>hyp(a.x-idle[0].x,a.y-idle[0].y)-hyp(b.x-idle[0].x,b.y-idle[0].y));
    const pick=targets[0];
    idle.slice(0,3).forEach(u=>setMove(u,pick.x+rnd(-16,16),pick.y+rnd(-16,16)));
   }
  }

  // 3. Engineers build defences or a Missile Silo near HQ / captured rigs
  const engs=myUnits.filter(u=>u.t=='eng'&&!u.path.length);
  if(engs.length&&f.oil>=160){
   const anchor=myRigs.length&&Math.random()<.5?myRigs[Math.random()*myRigs.length|0]:hq;
   if(anchor){
    const bx=cl(anchor.x+rnd(-95,95),60,W-60),by=cl(anchor.y+rnd(-95,95),60,W-60);
    if(Math.abs(by-RY)>100&&!onRoad(bx,by)&&!E.some(o=>hyp(o.x-bx,o.y-by)<34)){
     if(!mySilos.length&&f.oil>=550){
      placeDef(i,'silo',bx,by,0);
     }else{
      const kind=Math.random()<.45?'mg':Math.random()<.75?'at':'tower';
      placeDef(i,kind,bx,by,0);
     }
    }
   }
  }

  // 4. Fire Missile Silo barrage if ready and enemy targets exist
  for(const silo of mySilos){
   if(silo.siloCd<=0&&f.oil>=260){
    const targets=E.filter(e=>e.f>=0&&e.f!=i&&!e.dead&&(e.t=='hq'||e.t=='town'||e.k=='silo'||e.t=='tank'));
    if(targets.length){
     const tgt=targets[Math.random()*targets.length|0];
     launchSiloBarrage(silo,tgt.x,tgt.y);
    }
   }
  }

  // 5. Launch coordinated attack waves when army reaches 6+ combat units
  const army=myUnits.filter(u=>u.t=='inf'||u.t=='tank'||u.t=='art'||u.t=='scout');
  if(army.length>=6){
   const enemies=E.filter(e=>e.f>=0&&e.f!=i&&(e.t=='hq'||e.t=='town'||e.t=='rig'));
   if(enemies.length){
    enemies.sort((a,b)=>hyp(a.x-army[0].x,a.y-army[0].y)-hyp(b.x-army[0].x,b.y-army[0].y));
    const goal=enemies[0];
    army.forEach(u=>{if(!u.tgt)setMove(u,goal.x+rnd(-35,35),goal.y+rnd(-35,35))});
    if(f.oil>=340&&f.airCd<=0){
     callAirdrop(i,cl(goal.x+rnd(-60,60),80,W-80),cl(goal.y+rnd(-60,60),80,W-80));
    }
   }
  }
 }
}

function validDefPos(kind,x,y){
 if(x<24||x>W-24||y<24||y>W-24)return 0;
 if(Math.abs(y-RY)<92)return 0;
 const d=DEF[kind];if(!d)return 0;
 const road=onRoad(x,y);
 if(d.ter=='road'&&!road)return 0;
 if((d.ter=='sand'||d.ter=='land')&&road)return 0;
 if(E.some(e=>hyp(e.x-x,e.y-y)<(e.r||12)+(d.r||10)))return 0;
 return 1;
}

function placeDef(f,kind,x,y,rot=0){
 const d=DEF[kind];if(!d)return 0;
 if(F[f].oil<d.cost){if(f==0)say('Need '+d.cost+' Oil for '+d.n);return 0}
 if(!validDefPos(kind,x,y)){if(f==0)say('Invalid terrain for '+d.n);return 0}
 F[f].oil-=d.cost;
 if(kind=='trench'){
  trenches.push({f,x,y,r:22,ang:rot,hp:d.hp,mhp:d.hp});
  return 1;
 }
 mk({
  t:'def',k:kind,f,x,y,hp:d.hp,mhp:d.hp,s:1,def:1,
  r:d.r||10,vis:d.vis||140,cover:d.cover||0,blk:d.blk||0,gate:d.gate||0,
  rot,gang:0,garUnits:kind=='bunker'?[]:null,
  siloCd:0,volley:null
 });
 return 1;
}

function toggleBuildMenu(){
 const dm=$('dm');
 if(dm.style.display=='flex'){dm.style.display='none';buildMode=null;return}
 dm.innerHTML='<div style="color:#e8b04a;margin-bottom:4px"><b>ENGINEER BUILD [B]</b> (R: Rotate)</div>';
 for(const [k,d] of Object.entries(DEF)){
  const btn=document.createElement('button');
  btn.textContent=`${d.n} ($${d.cost}) [${d.ter}]`;
  btn.disabled=F[0].oil<d.cost;
  btn.onclick=()=>{
   buildMode={kind:k,rot:0,lineStart:null};
   dm.style.display='none';
   say('Click to place '+d.n+(LINE[k]?' (or drag a line)':'')+' • R to rotate • Esc to cancel');
  };
  dm.appendChild(btn);
 }
 dm.style.display='flex';
}

function screenToWorld(sx,sy){
 return{x:cam.x+sx/cam.z,y:cam.y+sy/cam.z};
}

function clampCam(){
 const vw=C.width/cam.z,vh=C.height/cam.z;
 cam.x=cl(cam.x,-80,Math.max(0,W-vw+80));
 cam.y=cl(cam.y,-80,Math.max(0,W-vh+80));
}

function updateUI(){
 const myUnits=E.filter(e=>e.f==0&&e.u).length;
 const myRigs=rigs.filter(r=>r.f==0).length;
 const myTowns=E.filter(e=>e.f==0&&(e.t=='town'||e.t=='hq')).length;
 $('top').innerHTML=
  `<span>OIL: <b>${Math.floor(F[0].oil)}</b></span>`+
  `<span>RIGS: <b>${myRigs}/${rigs.length}</b></span>`+
  `<span>BASES: <b>${myTowns}</b></span>`+
  `<span>UNITS: <b>${myUnits}</b></span>`+
  `<span>WEATHER: <b>${WX.mode.toUpperCase()}</b></span>`+
  `<span style="opacity:.75;font-size:12px">WASD/Drag: Pan • Wheel: Zoom • B: Build • D: Deploy HQ • H: Home</span>`;

 const info=$('info'),btns=$('btns');
 if(!sel.length){
  info.innerHTML='<div style="color:#9aa09f">No selection</div><div style="font-size:11px;opacity:.75">Left-click or drag to select units. Right-click to move/attack/capture.</div>';
  btns.innerHTML='';
  return;
 }
 if(sel.length==1){
  const e=sel[0];
  const name=e.u?ST[e.t].n:e.def?DEF[e.k].n:e.t=='hq'?'Command HQ':e.t=='town'?'Town':e.t=='rig'?'Oil Rig':'Entity';
  const owner=e.f<0?'Neutral':FN[e.f];
  let extra='';
  if(e.hp!=null)extra+=`HP: <b>${Math.ceil(e.hp)}/${e.mhp}</b> `;
  if(e.cap>0)extra+=`Cap: <b>${Math.floor(e.cap)}%</b>`;
  if(e.k=='bunker'&&e.garUnits)extra+=`Garrison: <b>${e.garUnits.length}/3</b>`;
  if(e.k=='silo')extra+=e.siloCd>0?`Reload: <b>${Math.ceil(e.siloCd)}s</b>`:`<b style="color:#2ea85c">ARMED</b>`;
  if(e.q&&e.q.length)extra+=`<br>Queue (${e.q.length}): ${ST[e.q[0].t].n} ${Math.ceil(e.q[0].tm-e.qt)}s`;
  info.innerHTML=`<div style="color:${e.f<0?'#ccc':FC[e.f]}"><b>${name}</b> (${owner})</div><div style="font-size:12px">${extra}</div>`;
 }else{
  info.innerHTML=`<div><b>${sel.length} Units Selected</b></div><div style="font-size:11px">Right-click to command • S: Hold</div>`;
 }

 // Action buttons for player-owned selection
 const f0=sel.filter(e=>e.f==0);
 if(!f0.length){btns.innerHTML='';return}
 let html='';
 const hq=f0.find(e=>e.t=='hq');
 const town=f0.find(e=>e.t=='town');
 if(hq){
  for(const k of ORDER){
   const s=ST[k];
   html+=`<button ${F[0].oil<s.cost?'disabled':''} onclick="queueUnit(sel.find(e=>e.t=='hq'&&e.f==0),'${k}')">[${s.k}] ${s.n} ($${s.cost})</button>`;
  }
  html+=`<button ${F[0].oil<ST.mcv.cost?'disabled':''} onclick="queueUnit(sel.find(e=>e.t=='hq'&&e.f==0),'mcv')">MCV ($${ST.mcv.cost})</button>`;
  html+=`<button ${F[0].oil<240||F[0].airCd>0?'disabled':''} onclick="buildMode={kind:'airdrop'};say('Click target LZ for Airborne Drop')">Airdrop ($240)${F[0].airCd>0?' ['+Math.ceil(F[0].airCd)+'s]':''}</button>`;
 }else if(town){
  for(const k of ['inf','eng']){
   const s=ST[k];
   html+=`<button ${F[0].oil<s.cost?'disabled':''} onclick="queueUnit(sel.find(e=>e.t=='town'&&e.f==0),'${k}')">[${s.k}] ${s.n} ($${s.cost})</button>`;
  }
 }
 if(f0.some(e=>e.t=='mcv')){
  html+=`<button onclick="deployMCV(sel.find(e=>e.t=='mcv'&&e.f==0))">[D] Deploy HQ</button>`;
 }
 if(f0.some(e=>e.t=='eng')){
  html+=`<button onclick="toggleBuildMenu()">[B] Build Defences</button>`;
 }
 if(f0.some(e=>e.t=='blayer')){
  html+=`<button onclick="buildMode={kind:'pontoon'};say('Click river to deploy Pontoon Bridge ($80)')">Deploy Pontoon ($80)</button>`;
 }
 const silo=f0.find(e=>e.k=='silo');
 if(silo){
  html+=`<button ${F[0].oil<120||silo.siloCd>0?'disabled':''} onclick="startSiloTarget()">[L] Launch Barrage ($120)${silo.siloCd>0?' ['+Math.ceil(silo.siloCd)+'s]':''}</button>`;
 }
 if(f0.some(e=>e.k=='bunker'&&e.garUnits&&e.garUnits.length)){
  html+=`<button onclick="evacBunker(sel.find(e=>e.k=='bunker'&&e.f==0))">Eject Garrison</button>`;

 if(f0.some(e=>e.u)){

 if(f0.some(e=>e.def)){
  html+=`<button onclick="salvageDef(sel.find(e=>e.def&&e.f==0))">Salvage (+50%)</button>`;

 btns.innerHTML=html;

function evacBunker(b){
 if(!b||!b.garUnits)return;
 while(b.garUnits.length){
  const u=b.garUnits.pop();
  u.x=b.x+rnd(-22,22);u.y=b.y+24;
  E.push(u);
 }
}

function salvageDef(d){
 if(!d||!d.def)return;
 const cfg=DEF[d.k];
 F[0].oil+=Math.floor((cfg?cfg.cost:20)*.5);
 kill(d);
}

function render(){
 if(C.width!=innerWidth||C.height!=innerHeight){C.width=innerWidth;C.height=innerHeight;clampCam()}
 X.fillStyle='#10140f';X.fillRect(0,0,C.width,C.height);
 X.save();
 X.scale(cam.z,cam.z);
 X.translate(-cam.x,-cam.y);

 // Ground + Roads + Town Kits

 for(const p of pontoons){

 }

 // Trenches
 for(const t of trenches){
  if(vi(0,t.x,t.y)==0)continue;
  X.save();X.translate(t.x,t.y);X.rotate(t.ang||0);
  R(X,-18,-6,36,12,'#5d4429');R(X,-15,-3,30,6,'#3a2b1a');
  X.restore();
 }

 // Wrecks
 for(const w of WR)if(vi(0,w.x,w.y)>0)Assets.draw(X,w.spr,0,w.x-(w.spr=='bunkerRubble'?16:8),w.y-(w.spr=='bunkerRubble'?16:8),w.ang);

 // Ghost silhouettes for enemies last seen in fog
 for(const [,g] of F[0].gh){

  drawEntitySprite(g,g.f<0?5:g.f);
  X.restore();
 }

 // Live entities (sorted by structures first, then units)
 const structures=E.filter(e=>!e.u&&seen(0,e));
 const units=E.filter(e=>e.u&&seen(0,e));
 for(const e of structures)drawEntity(e);
 for(const e of units)drawEntity(e);

 // Projectiles
 for(const p of P){
  if(vi(0,p.x,p.y)==0)continue;
  if(p.rocket){
   const ang=Math.atan2(p.ty-p.sy,p.tx-p.sx)+Math.PI/2;

   }
  }else if(p.ar){
   disc(X,Math.round(p.x),Math.round(p.y),3,'#23282d');
   disc(X,Math.round(p.x),Math.round(p.y)-2,2,'#e67e22');
  }else{
   X.strokeStyle=p.a=='at'?'#f5d76e':'#fff6d0';

   const a=Math.atan2(p.ty-p.sy,p.tx-p.sx);
   X.beginPath();X.moveTo(p.x,p.y);X.lineTo(p.x-Math.cos(a)*10,p.y-Math.sin(a)*10);X.stroke();
  }
 }

 // Smoke puffs & Explosions
 for(const c of CR)if(vi(0,c.x,c.y)>0){X.save();X.globalAlpha=1-c.t/.55;Assets.draw(X,'smokePuff',0,c.x-4,c.y-4);X.restore()}
 for(const f of FX){

  }else if(f.spark){
   disc(X,Math.round(f.x),Math.round(f.y),2,'#f5d76e');
  }else{
   Assets.explosion(X,f.x,f.y,f.t/.45);
  }
 }

 // Helicopters
 for(const h of HE){
  if(vi(0,h.x,h.y)==0)continue;
  Assets.draw(X,'heliTrans',h.f,h.x-12,h.y-12,h.ang);
  Assets.draw(X,'heliRotor',0,h.x-12,h.y-12,h.rot);
 }

 // Rally points for selected HQs/Towns
 for(const e of sel)if(e.f==0&&e.rally){
  X.strokeStyle='#2b7de9';X.setLineDash([4,4]);
  X.beginPath();X.moveTo(e.x,e.y);X.lineTo(e.rally.x,e.rally.y);X.stroke();
  X.setLineDash([]);
  disc(X,Math.round(e.rally.x),Math.round(e.rally.y),4,'#2b7de9');
 }

 // Build Mode / Targeting placement preview
 if(buildMode&&mouse.in){
  const w=screenToWorld(mouse.x,mouse.y);
  if(buildMode.kind=='airdrop'){
   X.strokeStyle='#e8b04a';X.lineWidth=1.5;
   X.beginPath();X.arc(w.x,w.y,36,0,6.28);X.stroke();
  }else if(buildMode.kind=='siloStrike'){
   X.strokeStyle='#d9383a';X.lineWidth=1.8;
   X.beginPath();X.arc(w.x,w.y,85,0,6.28);X.stroke();
   X.beginPath();X.moveTo(w.x-95,w.y);X.lineTo(w.x+95,w.y);X.moveTo(w.x,w.y-95);X.lineTo(w.x,w.y+95);X.stroke();
   if(buildMode.silo){
    X.strokeStyle='rgba(217,56,58,.45)';X.setLineDash([6,6]);
    X.beginPath();X.moveTo(buildMode.silo.x,buildMode.silo.y);X.lineTo(w.x,w.y);X.stroke();
    X.setLineDash([]);

   const ok=w.y>1136&&w.y<1264&&!canCrossRiver(w.x,w.y);
   X.fillStyle=ok?'rgba(46,168,92,.45)':'rgba(217,56,58,.45)';
   X.fillRect(w.x-14,1136,28,128);
  }else{
   const ok=validDefPos(buildMode.kind,w.x,w.y);
   X.strokeStyle=ok?'#2ea85c':'#d9383a';X.lineWidth=1.5;
   X.beginPath();X.arc(w.x,w.y,12,0,6.28);X.stroke();
   if(buildMode.lineStart&&LINE[buildMode.kind]){
    X.beginPath();X.moveTo(buildMode.lineStart.x,buildMode.lineStart.y);X.lineTo(w.x,w.y);X.stroke();
   }
  }
 }

 // Fog of War overlay
 X.drawImage(FCV,0,0,W,W);

 // Weather atmospheric overlay (world-space)
 if(WX.sand>.02){
  X.fillStyle=`rgba(214,176,106,${.18*WX.sand})`;
  X.fillRect(cam.x,cam.y,C.width/cam.z,C.height/cam.z);
 }
 if(WX.rain>.02){
  X.fillStyle=`rgba(25,40,55,${.16*WX.rain})`;
  X.fillRect(cam.x,cam.y,C.width/cam.z,C.height/cam.z);
 }

 X.restore();

 // Screen-space weather streaks
 if(WX.sand>.05||WX.rain>.05){
  X.save();
  X.strokeStyle=WX.sand>WX.rain?`rgba(235,200,130,${.25*WX.sand})`:`rgba(170,200,220,${.28*WX.rain})`;
  X.lineWidth=1;
  const cnt=Math.floor(70*Math.max(WX.sand,WX.rain));
  for(let i=0;i<cnt;i++){
   const sx=((i*197+T*(WX.sand>WX.rain?650:220))%C.width);
   const sy=((i*311+T*(WX.sand>WX.rain?120:780))%C.height);
   X.beginPath();X.moveTo(sx,sy);X.lineTo(sx+(WX.sand>WX.rain?22:6),sy+(WX.sand>WX.rain?4:16));X.stroke();
  }
  X.restore();
 }

 // Selection Drag Box
 if(mouse.drag){
  const x0=Math.min(mouse.drag.x0,mouse.x),y0=Math.min(mouse.drag.y0,mouse.y);
  const w=Math.abs(mouse.x-mouse.drag.x0),h=Math.abs(mouse.y-mouse.drag.y0);
  X.strokeStyle='#2ea85c';X.lineWidth=1;X.strokeRect(x0,y0,w,h);
  X.fillStyle='rgba(46,168,92,.14)';X.fillRect(x0,y0,w,h);
 }

 renderMinimap();
}

function drawEntitySprite(e,team){
 if(e.t=='rig')Assets.draw(X,'oilRig',team,e.x-16,e.y-16);
 else if(e.t=='town')Assets.draw(X,'town',team,e.x-16,e.y-16);
 else if(e.t=='hq')Assets.draw(X,'hq',team,e.x-24,e.y-24);
 else if(e.t=='scout')Assets.draw(X,'scoutCar',team,e.x-8,e.y-8,e.ang);
 else if(e.t=='inf')Assets.draw(X,'infantry',team,e.x-8,e.y-8,e.ang);
 else if(e.t=='eng')Assets.draw(X,'engineerTruck',team,e.x-8,e.y-8,e.ang);
 else if(e.t=='tank')Assets.drawTank(X,team,e.x-8,e.y-8,e.ang,e.tang||0);
 else if(e.t=='art')Assets.draw(X,'rocketArtillery',team,e.x-8,e.y-8,e.ang);
 else if(e.t=='truck')Assets.draw(X,'fuelTruck',team,e.x-8,e.y-8,e.ang);
 else if(e.t=='mcv')Assets.draw(X,'mcv',team,e.x-8,e.y-8,e.ang);
 else if(e.t=='blayer')Assets.draw(X,'bridgeLayer',team,e.x-8,e.y-8,e.ang);
 else if(e.def){
  const d=DEF[e.k];
  if(d.base){
   Assets.draw(X,d.base,team,e.x-8,e.y-8);
   Assets.draw(X,d.gun,team,e.x-8,e.y-8,e.gang||0);
  }else if(d.spr){
   const s=S[d.spr];
   Assets.draw(X,d.spr,team,e.x-s.w/2,e.y-s.h/2,e.rot||0);
  }
 }
}

function drawEntity(e){
 const team=e.f<0?5:e.f;
 drawEntitySprite(e,team);
 // Selection ring
 if(sel.includes(e)){
  X.strokeStyle=e.f==0?'#2ea85c':'#e8b04a';
  X.lineWidth=1.2;
  X.beginPath();X.arc(e.x,e.y,(e.r||10)+3,0,6.28);X.stroke();
 }
 // Health bar if damaged
 if(e.hp!=null&&e.mhp&&e.hp<e.mhp){
  const w=e.t=='hq'?34:e.r?24:14;
  R(X,e.x-w/2,e.y-(e.r||10)-6,w,3,'#111');
  R(X,e.x-w/2+1,e.y-(e.r||10)-5,(w-2)*(e.hp/e.mhp),1.5,e.f==0?'#2ea85c':'#e8b04a');
 }
 // Capture progress bar
 if(e.cap>0&&e.cf>=0){
  R(X,e.x-16,e.y+20,32,4,'#111');
  R(X,e.x-15,e.y+21,30*(e.cap/100),2,FC[e.cf]);
 }
}

 MX.drawImage(TC,0,0,150,150);
 for(const b of bridges){
  MX.fillStyle=b.hp>0?'#9a9c96':'#d9383a';

 }

  if(!seen(0,e))continue;
  MX.fillStyle=e.f<0?'#ccc':FC[e.f];

 }

// Input Handling
C.addEventListener('mousedown',ev=>{
 const w=screenToWorld(ev.clientX,ev.clientY);
 if(ev.button==1||(ev.button==0&&keys.Space)){
  mouse.pan={x0:ev.clientX,y0:ev.clientY,cx:cam.x,cy:cam.y};
  return;
 }
 if(ev.button==0){
  if(buildMode){
   if(buildMode.kind=='airdrop'){
    if(callAirdrop(0,w.x,w.y))buildMode=null;
    return;
   }
   if(buildMode.kind=='siloStrike'){
    if(launchSiloBarrage(buildMode.silo,w.x,w.y))buildMode=null;
    return;
   }
   if(buildMode.kind=='pontoon'){
    if(w.y>1136&&w.y<1264&&!canCrossRiver(w.x,w.y)){
     if(F[0].oil>=80){
      F[0].oil-=80;
      pontoons.push({x:w.x,y:RY,hp:220,mhp:220});
      buildMode=null;
      say('Pontoon bridge deployed!');
     }else say('Need 80 Oil for Pontoon Bridge');
    }else say('Click open river water to deploy pontoon');
    return;
   }
   if(LINE[buildMode.kind]){
    buildMode.lineStart={x:w.x,y:w.y};
   }else{
    if(placeDef(0,buildMode.kind,w.x,w.y,buildMode.rot)&&!ev.shiftKey)buildMode=null;
   }
   return;
  }
  mouse.drag={x0:ev.clientX,y0:ev.clientY};
 }else if(ev.button==2){
  if(buildMode){buildMode=null;say('Cancelled');return}
  issueRightClick(w.x,w.y,ev.shiftKey);
 }
});

window.addEventListener('mousemove',ev=>{
 mouse.x=ev.clientX;mouse.y=ev.clientY;mouse.in=1;
 if(mouse.pan){
  cam.x=mouse.pan.cx-(ev.clientX-mouse.pan.x0)/cam.z;
  cam.y=mouse.pan.cy-(ev.clientY-mouse.pan.y0)/cam.z;
  clampCam();
 }
});

window.addEventListener('mouseup',ev=>{
 if(mouse.pan){mouse.pan=null;return}
 if(ev.button==0&&buildMode&&buildMode.lineStart){
  const w=screenToWorld(ev.clientX,ev.clientY);
  const s=buildMode.lineStart,step=LINE[buildMode.kind];
  const dx=w.x-s.x,dy=w.y-s.y,dist=hyp(dx,dy);
  const cnt=Math.max(1,Math.floor(dist/step)+1);
  const ang=Math.atan2(dy,dx);
  for(let i=0;i<cnt;i++){
   const px=cnt==1?s.x:s.x+(dx*(i/(cnt-1)));
   const py=cnt==1?s.y:s.y+(dy*(i/(cnt-1)));
   if(!placeDef(0,buildMode.kind,px,py,ang))break;
  }
  buildMode.lineStart=null;
  if(!ev.shiftKey)buildMode=null;
  return;
 }
 if(ev.button==0&&mouse.drag){
  const x0=Math.min(mouse.drag.x0,ev.clientX),y0=Math.min(mouse.drag.y0,ev.clientY);
  const x1=Math.max(mouse.drag.x0,ev.clientX),y1=Math.max(mouse.drag.y0,ev.clientY);
  mouse.drag=null;
  if(x1-x0<6&&y1-y0<6){
   const w=screenToWorld(ev.clientX,ev.clientY);
   let hit=null,bd=28;
   for(const e of E){
    if(!seen(0,e))continue;
    const d=hyp(e.x-w.x,e.y-w.y);
    if(d<(e.r||14)+6&&d<bd){bd=d;hit=e}
   }
   if(hit){
    if(ev.shiftKey){
     const i=sel.indexOf(hit);
     if(i>=0)sel.splice(i,1);else sel.push(hit);
    }else sel=[hit];
   }else if(!ev.shiftKey)sel=[];
  }else{
   const a=screenToWorld(x0,y0),b=screenToWorld(x1,y1);
   const boxed=E.filter(e=>e.f==0&&e.u&&e.t!='truck'&&e.x>=a.x&&e.x<=b.x&&e.y>=a.y&&e.y<=b.y);
   if(boxed.length){
    sel=ev.shiftKey?[...new Set([...sel,...boxed])]:boxed;
   }
  }
 }
});

C.addEventListener('dblclick',ev=>{
 const w=screenToWorld(ev.clientX,ev.clientY);
 const hit=E.find(e=>e.f==0&&e.u&&hyp(e.x-w.x,e.y-w.y)<18);
 if(hit){
  if(hit.t=='mcv'){deployMCV(hit);return}
  const tl=screenToWorld(0,0),br=screenToWorld(C.width,C.height);
  sel=E.filter(e=>e.f==0&&e.t==hit.t&&e.x>=tl.x&&e.x<=br.x&&e.y>=tl.y&&e.y<=br.y);
 }
});

C.addEventListener('wheel',ev=>{
 ev.preventDefault();
 const before=screenToWorld(ev.clientX,ev.clientY);
 cam.z=cl(cam.z*(ev.deltaY<0?1.12:.89),.55,1.8);
 cam.x=before.x-ev.clientX/cam.z;
 cam.y=before.y-ev.clientY/cam.z;
 clampCam();
},{passive:false});

C.addEventListener('contextmenu',ev=>ev.preventDefault());

function issueRightClick(wx,wy,append){
 const f0=sel.filter(e=>e.f==0);
 if(!f0.length)return;
 // Set rally point if HQ/Town selected
 if(f0.every(e=>e.t=='hq'||e.t=='town')){
  f0.forEach(b=>b.rally={x:wx,y:wy});
  say('Rally point set');
  return;
 }
 // Check target under cursor
 let hit=null,bd=28;
 for(const e of E){
  if(!seen(0,e))continue;
  const d=hyp(e.x-wx,e.y-wy);
  if(d<(e.r||14)+8&&d<bd){bd=d;hit=e}
 }
 const brHit=bridges.find(b=>hyp(b.x-wx,b.y-wy)<26);

 for(const u of f0){
  if(!u.u||u.t=='truck')continue;
  if(hit&&hit.f>=0&&hit.f!=0){
   u.tgt=hit;u.act='attack';u.stop=0;
  }else if(hit&&hit.f==0&&hit.k=='bunker'&&u.t=='inf'){
   u.tgt=hit;u.act='garrison';u.stop=0;
  }else if(hit&&hit.f==0&&hit.hp<hit.mhp&&u.t=='eng'){
   u.tgt=hit;u.act='repair';u.stop=0;
  }else if(brHit&&(u.t=='eng'||u.t=='blayer')&&brHit.hp<brHit.mhp){
   setMove(u,brHit.x,brHit.y+(u.y<RY?-34:34),append);
  }else{
   setMove(u,wx+rnd(-12,12),wy+rnd(-12,12),append);
  }
 }
}

MM.addEventListener('mousedown',ev=>{
 const r=MM.getBoundingClientRect();
 const wx=((ev.clientX-r.left)/150)*W,wy=((ev.clientY-r.top)/150)*W;
 if(ev.button==0){
  if(buildMode&&buildMode.kind=='siloStrike'){
   if(launchSiloBarrage(buildMode.silo,wx,wy))buildMode=null;
   return;
  }
  cam.x=wx-(C.width/cam.z)/2;
  cam.y=wy-(C.height/cam.z)/2;
  clampCam();
 }else if(ev.button==2){
  issueRightClick(wx,wy,ev.shiftKey);
 }
});
MM.addEventListener('contextmenu',ev=>ev.preventDefault());

window.addEventListener('keydown',ev=>{
 keys[ev.code]=1;
 const k=ev.key.toLowerCase();
 if(k=='escape'){buildMode=null;$('dm').style.display='none';sel=[];return}
 if(buildMode&&k=='r'){buildMode.rot=(buildMode.rot+Math.PI/2)%(Math.PI*2);return}
 if(k=='b'&&sel.some(e=>e.f==0&&e.t=='eng')){toggleBuildMenu();return}
 if(k=='d'&&sel.some(e=>e.f==0&&e.t=='mcv')){deployMCV(sel.find(e=>e.f==0&&e.t=='mcv'));return}
 if(k=='l'&&sel.some(e=>e.f==0&&e.k=='silo')){startSiloTarget();return}
 if(k=='s'){sel.forEach(u=>{if(u.f==0&&u.u){u.path=[];u.tgt=null;u.stop=1}});return}
 if(k=='h'){
  const home=E.find(e=>e.f==0&&(e.t=='hq'||e.t=='mcv'))||E.find(e=>e.f==0);
  if(home){cam.x=home.x-(C.width/cam.z)/2;cam.y=home.y-(C.height/cam.z)/2;clampCam();sel=[home]}
  return;
 }
 // HQ unit hotkeys (Q,F,E,R,T,G)
 const hq=sel.find(e=>e.f==0&&(e.t=='hq'||e.t=='town'));
 if(hq&&!buildMode){
  for(const [uk,st] of Object.entries(ST)){
   if(st.k&&st.k.toLowerCase()==k){
    if(hq.t=='hq'||uk=='inf'||uk=='eng')queueUnit(hq,uk);
    return;
   }
  }
 }
 // Control groups 1..9
 if(ev.code.startsWith('Digit')){
  const n=ev.code.slice(5);
  if(ev.ctrlKey||ev.metaKey){grp[n]=[...sel];say('Group '+n+' saved');}
  else if(grp[n]){sel=grp[n].filter(e=>!e.dead)}
 }
});
window.addEventListener('keyup',ev=>{keys[ev.code]=0});

let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);
 last=now;
 if(!over){
  T+=dt;
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
  for(const f of F)if(f.airCd>0)f.airCd=Math.max(0,f.airCd-dt);

  // Keyboard camera pan
  const pspd=560/cam.z;
  if(keys.KeyW||keys.ArrowUp)cam.y-=pspd*dt;
  if(keys.KeyS||keys.ArrowDown)cam.y+=pspd*dt;
  if(keys.KeyA||keys.ArrowLeft)cam.x-=pspd*dt;
  if(keys.KeyD||keys.ArrowRight)cam.x+=pspd*dt;
  clampCam();

  updateUnits(dt);
  updateProjectiles(dt);
  updateHelis(dt);
  updateAI(dt);
  updateFX(dt);
  updVis();
  updGh(dt);
  updFog();
  updateUI();
 }
 render();
 requestAnimationFrame(loop);
}

// Center camera on Blue's starting MCV
cam.x=500-innerWidth/2;
cam.y=2130-innerHeight/2;
clampCam();
say('Deploy your Mobile HQ [D] and capture Oil Rigs!');
requestAnimationFrame(loop);
</script></body></html>
